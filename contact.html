<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif
        }

        body {
            background: linear-gradient(to bottom, #ffeef8, #f7e6ff, #fff);
            overflow-x: hidden
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: rgb(255 255 255 / .4);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 15px rgb(0 0 0 / .08)
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo h2 {
            color: #c85aa6;
            letter-spacing: 2px
        }

        .logo img {
            width: 65px;
            animation: terbang 3s infinite ease-in-out
        }

        @keyframes terbang {
            0% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }

            100% {
                transform: translateY(0)
            }
        }

        nav a {
            text-decoration: none;
            margin-left: 25px;
            color: #8a3d72;
            font-weight: 700;
            transition: 0.3s
        }

        nav a:hover {
            color: #ff9bd2
        }

        .contact {
            padding: 80px 10%;
            background: #fff7fc;
            text-align: center
        }

        .contact h2 {
            font-size: 40px;
            color: #b14f91;
            margin-bottom: 30px
        }

        form {
            max-width: 600px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 20px
        }

        form input,
        form textarea {
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #f3e5f5;
            font-size: 16px
        }

        form textarea {
            height: 150px;
            resize: none
        }

        form button {
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(to right, #ff9bd2, #d88cff);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s
        }

        form button:hover {
            opacity: .8
        }

        footer {
            background: #b14f91;
            color: #fff;
            text-align: center;
            padding: 25px;
            letter-spacing: 1px
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
            <h2>Fairy Jewel</h2>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="collection.html">Collection</a>
            <a href="#magicbox">Magic Box</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="contact" class="contact">

        <h2>📞 Contact Us</h2>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </form>

    </section>
    <footer>
        © 2026 Fairy Jewel | Magic in Every Sparkle ✨
    </footer>

</body>

</html>
